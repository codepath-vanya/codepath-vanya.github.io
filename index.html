  art:{
    en:`<h3>1. History & Virtual Machine</h3><p>Created in 1991 by Guido van Rossum, Python uses 4-space indentation instead of curly braces <code>{}</code>. CPython compiles source code into bytecode executed by the Python Virtual Machine with automatic garbage collection.</p><h3>2. Basics: print, input & Types</h3><p>Output uses <code>print("Hello")</code> and keyboard input uses <code>x = input()</code> (always returns string; convert via <code>int()</code> or <code>float()</code>). Types include <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>, and <code>None</code>.</p><h3>3. Conditions (if / elif / else) & Loops</h3><p>Branching uses <code>if score >= 90:</code>, <code>elif score >= 70:</code> (else if), and <code>else:</code>, plus <code>match / case</code>. Collections include <b>Lists</b> (<code>[]</code>), <b>Tuples</b> (<code>()</code>), <b>Sets</b>, and <b>Dictionaries</b> (<code>{"hp": 100}</code>), iterated via <code>for</code>, <code>while</code>, and comprehensions.</p><h3>4. Functions, OOP & Error Handling</h3><p>Functions use <code>def</code> and <code>lambda</code>; OOP uses <code>class Hero:</code> with <code>__init__</code>; errors are caught via <code>try / except / finally</code>.</p><h3>5. Pygame, Telegram Bots & AI</h3><p>Via <code>pip</code>, Python powers 2D games in <b>Pygame</b> (60 FPS loops, sprites, collisions), async bots in <b>aiogram</b>, web backends in <b>FastAPI/Django</b>, and neural networks in <b>PyTorch</b>, <b>TensorFlow</b>, and <b>OpenCV</b>.</p>`,
    ru:`<h3>1. История создания и виртуальная машина</h3><p>Создан в 1991 году Гвидо ван Россумом. Вместо фигурных скобок <code>{}</code> Python использует отступы (4 пробела). Стандартный движок CPython переводит код в байт-код и исполняет его на виртуальной машине с автоматическим сборщиком мусора.</p><h3>2. Базовый уровень: print, input и типы данных</h3><p>Вывод на экран выполняется через <code>print("Привет!")</code>, а ввод с клавиатуры — через <code>name = input()</code> (всегда возвращает строку, для математики её переводят через <code>int()</code> или <code>float()</code>). Основные типы: <code>int</code> (целые числа), <code>float</code> (дробные), <code>str</code> (текст), <code>bool</code> (<code>True/False</code>) и <code>None</code>.</p><h3>3. Ветвление (if / elif / else) и циклы</h3><p>Условия строятся через <code>if score >= 90:</code>, <code>elif score >= 70:</code> (иначе если) и <code>else:</code>, а в новых версиях также через <code>match / case</code>. Встроенные коллекции: <b>списки</b> (<code>[]</code>), <b>кортежи</b> (<code>()</code>), <b>множества</b> и <b>словари</b> (<code>{"hp": 100}</code>). Повторения выполняют циклы <code>for</code>, <code>while</code> и генераторы списков <code>[x*2 for x in range(10)]</code>.</p><h3>4. Функции, классы (ООП) и защита от сбоев</h3><p>Повторяемый код оформляют в функции <code>def attack():</code> и <code>lambda</code>. Крупные проекты строят на классах <code>class Player:</code> с конструктором <code>__init__</code> и наследованием, а защиту от ошибок ввода делают через <code>try / except / finally</code>.</p><h3>5. Продвинутый уровень: Pygame, Telegram-боты, веб и ИИ</h3><p>Через <code>pip</code> подключаются мощные фреймворки: <b>Pygame</b> создаёт 2D-игры с игровым циклом 60 FPS, спрайтами и физикой столкновений; <b>aiogram</b> и <b>pyTelegramBotAPI</b> запускают быстрых Telegram-ботов; <b>Django</b> и <b>FastAPI</b> обслуживают веб-серверы; <b>PyTorch</b>, <b>TensorFlow</b>, <b>Pandas</b> и <b>OpenCV</b> используются для нейросетей и анализа данных.</p>`
  }

  art:{
    en:`<h3>1. V8 Engine & Execution Model</h3><p>Created in 1995 by Brendan Eich. Executed natively in all browsers via JIT engines (V8) using an Event Loop, and on servers via <b>Node.js</b>.</p><h3>2. Variables & Conditions (if / else if / else)</h3><p>Uses <code>const</code> (constants) and <code>let</code> (variables), outputting via <code>console.log()</code>. Branching uses <code>if () {}</code>, <code>else if () {}</code>, <code>else {}</code>, and strict equality <code>===</code>.</p><h3>3. DOM, Events & Async/Await</h3><p>Selects elements via <code>document.querySelector()</code> and handles clicks with <code>addEventListener()</code>. <code>Promises</code>, <code>async / await</code>, and <code>fetch()</code> load API data without freezing the UI.</p><h3>4. React, Node.js & Browser Games</h3><p>Powers web apps (<b>React</b>, <b>Vue</b>, <b>Next.js</b>), servers (<b>Node.js/Express</b>), mobile/desktop apps (<b>React Native</b>, <b>Electron</b>), and 2D/3D WebGL games (<b>Three.js</b>, <b>Phaser</b>).</p>`,
    ru:`<h3>1. Движок V8 и модель выполнения</h3><p>Создан в 1995 году Бренданом Эйхом. Встроен в каждый браузер (движки V8, SpiderMonkey) и компилируется на лету (JIT), а на серверах работает через <b>Node.js</b>.</p><h3>2. Переменные, строгое сравнение и условия (if / else if / else)</h3><p>Современный JS использует <code>const</code> для констант и <code>let</code> для переменных, вывод в консоль — <code>console.log()</code>. Ветвление строится через <code>if (hp > 50) {}</code>, <code>else if (hp > 0) {}</code> и <code>else {}</code> со строгим сравнением <code>===</code>.</p><h3>3. Управление страницей (DOM) и асинхронность</h3><p>Через <code>document.querySelector()</code> и <code>addEventListener()</code> код меняет HTML/CSS и реагирует на клики без перезагрузки. Асинхронные <code>Promise</code>, <code>async / await</code> и <code>fetch()</code> загружают данные с серверов в фоновом режиме.</p><h3>4. Продвинутый уровень: React, Node.js и игры WebGL</h3><p>На JS создаются сайты (<b>React</b>, <b>Vue</b>, <b>Next.js</b>), серверы (<b>Node.js</b>, <b>Express</b>), программы для ПК и телефонов (<b>Electron</b>, <b>React Native</b>) и 2D/3D-игры в браузере (<b>Three.js</b>, <b>PixiJS</b>, <b>Phaser</b>).</p>`
  }

     en:`<h3>1. Document Structure & Tags</h3><p>Created in 1991. Starts with <code>&lt;!DOCTYPE html&gt;</code>, <code>&lt;head&gt;</code>, and <code>&lt;body&gt;</code>. Uses headings <code>&lt;h1&gt;–&lt;h6&gt;</code>, paragraphs <code>&lt;p&gt;</code>, links <code>&lt;a&gt;</code>, and media <code>&lt;img&gt;</code>, <code>&lt;video&gt;</code>.</p><h3>2. Forms, Semantic HTML5 & Canvas</h3><p>Forms use <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code>, and <code>&lt;button&gt;</code>. Semantic blocks (<code>&lt;header&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code>) and <code>&lt;canvas&gt;</code> power apps and 2D/3D graphics.</p>`,
     ru:`<h3>1. Структура страницы и теги</h3><p>Создан Тимом Бернерсом-Ли в 1991 году. Делится на <code>&lt;head&gt;</code> (настройки) и <code>&lt;body&gt;</code> (контент). Основные теги: заголовки <code>&lt;h1&gt;–&lt;h6&gt;</code>, абзацы <code>&lt;p&gt;</code>, ссылки <code>&lt;a href&gt;</code> и картинки <code>&lt;img&gt;</code>.</p><h3>2. Формы, семантика HTML5 и графика Canvas</h3><p>Формы ввода строятся через <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code> и <code>&lt;button&gt;</code>. Семантические теги (<code>&lt;header&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code>) и холст <code>&lt;canvas&gt;</code> используются для веб-приложений и браузерных игр.</p>`
